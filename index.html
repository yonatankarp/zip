<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zip</title>
<meta name="description" content="A Zip clone with randomly generated, guaranteed-solvable puzzles in four difficulties.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1014'/%3E%3Cpath d='M9 9h14L9 23h14' stroke='%23f5b544' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Dark is the base palette; light is applied when the system asks for it, or
     when the theme button pins it. Pinning dark wins over the media query. */
  :root {
    --bg: #0e1014;
    --panel: #171a21;
    --board: #131720;
    --line: #272d3a;
    --ink: #e9edf5;
    --dim: #868fa3;
    --accent: #f5b544;
    --accent-ink: #14161c;
    --path: #4d8bff;
    --path-ink: #ffffff;
    --wall: #c2cbdd;
    --good: #35d07f;
    --bad: #ff6259;
    --shadow: 0 14px 44px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f4f8; --panel: #ffffff; --board: #ffffff; --line: #e0e5ef;
      --ink: #121722; --dim: #6b7385; --accent: #f0a92c; --accent-ink: #221a05;
      --path: #2f6bff; --wall: #2c3446; --shadow: 0 14px 40px rgba(20, 30, 60, .12);
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f4f8; --panel: #ffffff; --board: #ffffff; --line: #e0e5ef;
    --ink: #121722; --dim: #6b7385; --accent: #f0a92c; --accent-ink: #221a05;
    --path: #2f6bff; --wall: #2c3446; --shadow: 0 14px 40px rgba(20, 30, 60, .12);
  }

  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    gap: 13px; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 13px; }

  /* ---------------------------------------------------------------- header */
  header { display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
  .brand svg { display: block; }
  .spacer { flex: 1; }
  .clock {
    font: 650 25px/1 ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    transition: color .2s;
  }
  .clock.done { color: var(--good); }
  .icon-btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icon-btn:hover { color: var(--ink); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  /* ----------------------------------------------------------------- tiers */
  .tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tier {
    appearance: none; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); border-radius: 10px; padding: 9px 4px; cursor: pointer;
    font: 600 13px/1 inherit; transition: background .12s, color .12s, border-color .12s;
  }
  .tier:hover { color: var(--ink); }
  .tier[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }

  /* ----------------------------------------------------------------- board */
  /* Celebration layer: covers the viewport so a burst is not boxed in by the
     board, and never intercepts input or adds scrollbars. */
  svg.fx {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 20; overflow: hidden;
  }
  @keyframes boardPop {
    0% { transform: scale(1); } 35% { transform: scale(1.025); } 100% { transform: scale(1); }
  }
  svg.board.won { animation: boardPop .45s ease-out; }
  @media (prefers-reduced-motion: reduce) { svg.board.won { animation: none; } }

  .boardwrap { position: relative; }
  svg.board { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }
  svg.board.busy { opacity: .3; pointer-events: none; }
  .progress { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--path); transition: width .12s linear; }
  .progress i.done { background: var(--good); }

  .banner {
    position: absolute; inset: auto 0 12px 0; display: none; justify-content: center;
    pointer-events: none;
  }
  .banner.show { display: flex; }
  .banner b {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 20px; font-size: 16px; text-align: center; box-shadow: var(--shadow);
  }
  .banner b small { display: block; font-weight: 400; color: var(--dim); font-size: 12.5px; margin-top: 3px; }

  /* -------------------------------------------------------------- controls */
  .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 10px; padding: 12px 2px; cursor: pointer; font: 500 12.5px/1 inherit;
  }
  .btn:hover { border-color: var(--dim); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--path); border-color: var(--path); color: #fff; }

  .status {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .status b { color: var(--ink); font-weight: 600; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--dim);
    border-radius: 999px; padding: 5px 11px; cursor: pointer; font: 500 12px/1 inherit;
  }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--dim); }
  .chip .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--line); margin-right: 6px; vertical-align: 1px;
  }
  .chip[aria-pressed="true"] .dot { background: var(--good); }
  .hint { color: var(--dim); font-size: 11.5px; text-align: center; line-height: 1.9; }
  kbd {
    font: 11px/1 ui-monospace, Menlo, monospace; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink);
  }
  @media (max-width: 380px) { .hint { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--accent)"></rect>
        <path d="M9 9h14L9 23h14" stroke="var(--accent-ink)" stroke-width="3.4" fill="none"
              stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Zip
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="soundBtn" title="Sound" aria-label="Sound">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path id="soundWave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"></path>
        <path id="soundWaveFar" d="M18.5 7a7 7 0 0 1 0 10"></path>
        <path id="soundMute" d="M17 9.5l4 5m0-5l-4 5" style="display:none"></path>
      </svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"></path>
      </svg>
    </button>
    <div class="clock" id="clock">0:00.0</div>
  </header>

  <div class="tiers" id="tiers"></div>

  <svg class="fx" id="fx" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="boardwrap">
    <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="banner" id="banner"><b id="bannerText"></b></div>
  </div>
  <div class="progress"><i id="progressFill"></i></div>

  <div class="controls">
    <button class="btn primary" id="newBtn">New</button>
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn" id="undoBtn">Undo</button>
    <button class="btn" id="hintBtn">Hint</button>
    <button class="btn" id="revealBtn">Reveal</button>
  </div>

  <div class="status">
    <div><b id="filled">0</b> / <span id="total">0</span></div>
    <div id="tierStats"></div>
    <div>best <b id="best">—</b></div>
  </div>
  <div class="status">
    <button class="chip" id="autoBtn" aria-pressed="true"><span class="dot"></span>Auto-next</button>
    <div id="session">no solves yet</div>
  </div>
  <div class="hint">
    drag from <b>1</b> · <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> move ·
    <kbd>U</kbd> undo · <kbd>H</kbd> hint · <kbd>R</kbd> restart · <kbd>N</kbd> new
  </div>
</div>
<!-- ===== engine: generation, solving, difficulty measurement ===== -->
<script>

/*
 * Zip engine: puzzle generation, uniqueness checking, difficulty measurement.
 *
 * A puzzle is a grid with numbered cells and walls. The solution is a single
 * path that visits every cell exactly once, starts at number 1, ends at the
 * highest number, hits the numbers in ascending order, and never crosses a wall.
 *
 * Puzzle shape:
 *   { rows, cols, walls: [[a,b], ...], waypoints: [cell, ...], solution: [cell, ...] }
 * Cells are indexed r * cols + c. Wall pairs are always [min, max].
 */
;(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && typeof module.exports === 'object') module.exports = api;
  else root.Zip = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------------------------------------------------------------- random

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = (rng() * (i + 1)) | 0;
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ------------------------------------------------------------------ grid

  function gridNeighbors(rows, cols) {
    var n = rows * cols, nbrs = new Array(n);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c, a = [];
        if (r > 0) a.push(i - cols);
        if (r < rows - 1) a.push(i + cols);
        if (c > 0) a.push(i - 1);
        if (c < cols - 1) a.push(i + 1);
        nbrs[i] = a;
      }
    }
    return nbrs;
  }

  function edgeKey(a, b) { return a < b ? a * 65536 + b : b * 65536 + a; }

  // Adjacency with walled edges removed.
  function buildAdjacency(rows, cols, walls) {
    var base = gridNeighbors(rows, cols);
    if (!walls || !walls.length) return base;
    var blocked = new Set();
    for (var w = 0; w < walls.length; w++) blocked.add(edgeKey(walls[w][0], walls[w][1]));
    return base.map(function (list, i) {
      return list.filter(function (j) { return !blocked.has(edgeKey(i, j)); });
    });
  }

  // ------------------------------------------------------- path generation

  // Snake path: row 0 left-to-right, row 1 right-to-left, ... Always valid.
  function boustrophedon(rows, cols) {
    var p = [];
    for (var r = 0; r < rows; r++) {
      for (var k = 0; k < cols; k++) {
        var c = (r % 2 === 0) ? k : cols - 1 - k;
        p.push(r * cols + c);
      }
    }
    return p;
  }

  /*
   * Backbite: sample a Hamiltonian path by repeatedly re-hinging an endpoint.
   * Take the tail cell e, pick a random grid-neighbour u = p[i], then reverse
   * p[i+1..end]. The added edge is u-e, the dropped edge is p[i]-p[i+1], so the
   * result is always a valid Hamiltonian path -- the move can never fail.
   * Mixes far better than random DFS, which hugs the boundary.
   */
  function backbite(rows, cols, rng, iterations) {
    var n = rows * cols;
    var nbrs = gridNeighbors(rows, cols);
    var p = boustrophedon(rows, cols);
    var pos = new Int32Array(n);
    var i;
    for (i = 0; i < n; i++) pos[p[i]] = i;
    var iters = iterations || Math.max(2000, n * 120);
    for (var t = 0; t < iters; t++) {
      if (rng() < 0.5) {                       // work on the other endpoint
        p.reverse();
        for (i = 0; i < n; i++) pos[p[i]] = i;
      }
      var e = p[n - 1];
      var cand = nbrs[e];
      var u = cand[(rng() * cand.length) | 0];
      var idx = pos[u];
      if (idx >= n - 2) continue;              // no-op re-hinge
      var lo = idx + 1, hi = n - 1;
      while (lo < hi) {
        var tmp = p[lo]; p[lo] = p[hi]; p[hi] = tmp;
        pos[p[lo]] = lo; pos[p[hi]] = hi;
        lo++; hi--;
      }
      if (lo === hi) pos[p[lo]] = lo;
    }
    return p;
  }

  // Walls only ever go on edges the solution does not use, so the intended
  // path stays valid no matter how many we add.
  function pickWalls(rows, cols, path, count, rng) {
    if (count <= 0) return [];
    var used = new Set();
    for (var i = 0; i + 1 < path.length; i++) used.add(edgeKey(path[i], path[i + 1]));
    var nbrs = gridNeighbors(rows, cols), free = [];
    for (var a = 0; a < nbrs.length; a++) {
      for (var k = 0; k < nbrs[a].length; k++) {
        var b = nbrs[a][k];
        if (a < b && !used.has(edgeKey(a, b))) free.push([a, b]);
      }
    }
    shuffle(free, rng);
    return free.slice(0, Math.min(count, free.length)).sort(function (x, y) {
      return x[0] - y[0] || x[1] - y[1];
    });
  }

  // Waypoint positions along the path. Always includes the two endpoints;
  // minGap keeps consecutive numbers from landing on top of each other.
  function pickWaypointIndices(n, k, rng, minGap) {
    var gap = minGap || 2;
    if (k < 2) k = 2;
    if (k > n) k = n;
    for (var attempt = 0; attempt < 60; attempt++) {
      var pool = [];
      for (var i = 1; i < n - 1; i++) pool.push(i);
      shuffle(pool, rng);
      var chosen = [0, n - 1];
      for (var j = 0; j < pool.length && chosen.length < k; j++) {
        var v = pool[j], ok = true;
        for (var m = 0; m < chosen.length; m++) {
          if (Math.abs(chosen[m] - v) < gap) { ok = false; break; }
        }
        if (ok) chosen.push(v);
      }
      if (chosen.length === k) return chosen.sort(function (x, y) { return x - y; });
    }
    return null;
  }

  // -------------------------------------------------------------- analysis

  /*
   * Shared machinery for the counting solver and the difficulty scorer.
   * Everything is preallocated and mutated in place; the DFS never allocates.
   */
  function makeEngine(puzzle) {
    var rows = puzzle.rows, cols = puzzle.cols, n = rows * cols;
    var adj = buildAdjacency(rows, cols, puzzle.walls);
    var wps = puzzle.waypoints, K = wps.length;
    var target = wps[K - 1];

    var numAt = new Int32Array(n);
    for (var i = 0; i < K; i++) numAt[wps[i]] = i + 1;

    var color = new Uint8Array(n);
    for (var c = 0; c < n; c++) color[c] = (((c / cols) | 0) + (c % cols)) & 1;

    var visited = new Uint8Array(n);
    var freeByColor = new Int32Array(2);
    var stack = new Int32Array(n);
    var reachedList = new Int32Array(n);
    var mark = new Int32Array(n);
    var headAdj = new Int32Array(n);
    var stamp = 0;

    function reset() {
      visited.fill(0);
      freeByColor[0] = 0; freeByColor[1] = 0;
      for (var j = 0; j < n; j++) freeByColor[color[j]]++;
    }
    function visit(cell) { visited[cell] = 1; freeByColor[color[cell]]--; }
    function unvisit(cell) { visited[cell] = 0; freeByColor[color[cell]]++; }

    /*
     * Necessary conditions for the remaining unvisited cells to admit a
     * Hamiltonian path from `head` to `target`. Cheap checks first.
     */
    function feasible(head, remaining) {
      if (remaining === 0) return head === target;
      if (visited[target]) return false;

      // Parity: the remaining cells alternate colours starting opposite head,
      // which pins both the colour counts and the colour of the final cell.
      var other = color[head] ^ 1;
      var wantOther = (remaining + 1) >> 1;
      if (freeByColor[other] !== wantOther) return false;
      if (freeByColor[color[head]] !== remaining - wantOther) return false;
      if (color[target] !== (color[head] ^ (remaining & 1))) return false;

      stamp++;
      var s = stamp, k, w;
      var ha = adj[head];
      for (k = 0; k < ha.length; k++) headAdj[ha[k]] = s;

      // Flood fill the unvisited region from head: everything must be reachable.
      var sp = 0, reached = 0;
      var a0 = adj[head];
      for (k = 0; k < a0.length; k++) {
        w = a0[k];
        if (!visited[w] && mark[w] !== s) {
          mark[w] = s; stack[sp++] = w; reachedList[reached++] = w;
        }
      }
      if (sp === 0) return false;
      while (sp > 0) {
        var v = stack[--sp];
        var av = adj[v];
        for (k = 0; k < av.length; k++) {
          w = av[k];
          if (!visited[w] && mark[w] !== s) {
            mark[w] = s; stack[sp++] = w; reachedList[reached++] = w;
          }
        }
      }
      if (reached !== remaining) return false;

      // Degree: every remaining cell needs two open sides to be passed through
      // (one if it is where the path terminates).
      for (var r = 0; r < reached; r++) {
        var cell = reachedList[r];
        var deg = (headAdj[cell] === s) ? 1 : 0;
        var ac = adj[cell];
        for (k = 0; k < ac.length; k++) if (!visited[ac[k]]) deg++;
        if (deg < (cell === target ? 1 : 2)) return false;
      }

    }

    /*
     * Is stepping onto `cell` legal given the path drawn so far? This is the
     * single source of truth for the rules during play -- the UI must not
     * restate them. `inPath` is a Uint8Array flag per cell.
     */
    function canStep(path, inPath, cell) {
      if (cell < 0 || cell >= n) return false;
      if (path.length === 0) return cell === wps[0];
      if (inPath[cell]) return false;
      var head = path[path.length - 1];
      if (adj[head].indexOf(cell) === -1) return false;   // adjacent and not walled
      var m = numAt[cell];
      if (m === 0) return true;
      var next = 1;
      for (var i = 0; i < path.length; i++) if (numAt[path[i]] !== 0) next++;
      return m === next;                                  // numbers in ascending order
    }

    // Legal single steps out of `head`, ignoring look-ahead.
    function moves(head, nextWp, out) {
      out.length = 0;
      var ah = adj[head];
      for (var k = 0; k < ah.length; k++) {
        var w = ah[k];
        if (visited[w]) continue;
        var m = numAt[w];
        if (m !== 0 && m !== nextWp) continue;   // numbers must be taken in order
        out.push(w);
      }
      return out;
    }

    // Enumerate solutions, stopping at `cap` (2 is enough to test uniqueness).
    // Returns the actual paths so the generator can inspect a rival solution.
    function findSolutions(cap) {
      var limit = cap || 2;
      reset();
      var start = wps[0];
      visit(start);
      var found = [];
      var cur = new Int32Array(n);
      cur[0] = start;

      function rec(head, count, nextWp) {
        if (count === n) {
          if (head === target && nextWp > K) found.push(Array.prototype.slice.call(cur));
          return;
        }
        if (!feasible(head, n - count)) return;
        var ah = adj[head];
        for (var k = 0; k < ah.length; k++) {
          var w = ah[k];
          if (visited[w]) continue;
          var m = numAt[w];
          if (m !== 0 && m !== nextWp) continue;
          visit(w);
          cur[count] = w;
          rec(w, count + 1, m !== 0 ? nextWp + 1 : nextWp);
          unvisit(w);
          if (found.length >= limit) return;
        }
      }
      rec(start, 1, 2);
      return found;
    }

    function countSolutions(cap) { return findSolutions(cap).length; }

    /*
     * Walk the intended solution and count how often a solver is genuinely
     * stuck for a choice. `guesses` applies full look-ahead (connectivity,
     * dead ends, parity) -- a strong solver. `shallowGuesses` applies only the
     * immediate rules. Real difficulty sits between the two; guesses is the
     * stable one to band on.
     */
    function analyze(solution) {
      reset();
      var buf = [];
      var head = solution[0];
      visit(head);
      var nextWp = 2;
      var guesses = 0, shallowGuesses = 0, branchSum = 0, maxBranch = 0;
      var guessAt = [];
      var forcedRun = 0, longestForcedRun = 0;

      for (var t = 0; t + 1 < n; t++) {
        head = solution[t];
        var legal = moves(head, nextWp, buf).slice();
        if (legal.length > 1) shallowGuesses++;

        var strong = [];
        for (var k = 0; k < legal.length; k++) {
          var w = legal[k];
          visit(w);
          if (feasible(w, n - (t + 2))) strong.push(w);
          unvisit(w);
        }
        if (strong.length > 1) {
          guesses++;
          branchSum += strong.length - 1;
          if (strong.length > maxBranch) maxBranch = strong.length;
          guessAt.push(t);
          if (forcedRun > longestForcedRun) longestForcedRun = forcedRun;
          forcedRun = 0;
        } else {
          forcedRun++;
        }

        var nxt = solution[t + 1];
        visit(nxt);
        if (numAt[nxt] !== 0) nextWp++;
      }
      if (forcedRun > longestForcedRun) longestForcedRun = forcedRun;

      return {
        guesses: guesses,
        shallowGuesses: shallowGuesses,
        branchSum: branchSum,
        maxBranch: maxBranch,
        longestForcedRun: longestForcedRun,
        guessAt: guessAt
      };
    }

    // Structural check of an arbitrary path against the rules -- used to
    // validate the player's solve without trusting the stored solution.
    function validate(path) {
      if (!path || path.length !== n) return false;
      var seen = new Uint8Array(n);
      for (var i = 0; i < n; i++) {
        var cell = path[i];
        if (cell < 0 || cell >= n || seen[cell]) return false;
        seen[cell] = 1;
        if (i > 0 && adj[path[i - 1]].indexOf(cell) === -1) return false;
      }
      var expect = 1;
      for (var j = 0; j < n; j++) {
        var m = numAt[path[j]];
        if (m !== 0) {
          if (m !== expect) return false;
          expect++;
        }
      }
      return expect === K + 1 && path[0] === wps[0] && path[n - 1] === target;
    }

    return {
      n: n, adj: adj, numAt: numAt, target: target,
      countSolutions: countSolutions, findSolutions: findSolutions,
      analyze: analyze, validate: validate, canStep: canStep
    };
  }

  // ------------------------------------------------------------ generation

  /*
   * Generate by refinement rather than by luck.
   *
   * Sample a path, then repeatedly ask "is this puzzle ambiguous?". If a rival
   * solution exists it must use some edge the intended path does not -- walling
   * that edge kills the rival and cannot touch the intended path. Walls are the
   * cheap constraint, so they go in first; numbers are added only once the wall
   * budget runs out, or to pull an over-hard puzzle back into its band.
   */
  function refine(path, rows, cols, rng, cfg) {
    var n = rows * cols;
    var wpIdx = pickWaypointIndices(n, cfg.waypoints, rng, cfg.minGap);
    if (!wpIdx) return null;
    var used = new Set();
    for (var i = 0; i + 1 < path.length; i++) used.add(edgeKey(path[i], path[i + 1]));

    // Seed some walls before the first solve. They cost nothing (off-path edges
    // can never invalidate the solution) and they shrink the search space a lot,
    // which is what keeps generation fast on the larger grids.
    var walls = pickWalls(rows, cols, path, Math.min(cfg.seedWalls, cfg.wallBudget), rng);

    function addWaypoint() {
      if (wpIdx.length >= cfg.maxWaypoints) return false;
      var pool = [];
      for (var j = 1; j < n - 1; j++) {
        var ok = true;
        for (var m = 0; m < wpIdx.length; m++) {
          if (Math.abs(wpIdx[m] - j) < cfg.minGap) { ok = false; break; }
        }
        if (ok) pool.push(j);
      }
      if (!pool.length) return false;
      wpIdx.push(pool[(rng() * pool.length) | 0]);
      wpIdx.sort(function (a, b) { return a - b; });
      return true;
    }

    function build() {
      return {
        rows: rows, cols: cols, walls: walls.slice(),
        waypoints: wpIdx.map(function (i) { return path[i]; }),
        solution: path.slice()
      };
    }

    for (var step = 0; step < cfg.maxRefineSteps; step++) {
      var puzzle = build();
      var eng = makeEngine(puzzle);
      var sols = eng.findSolutions(2);
      if (sols.length === 0) return null;            // over-walled, shouldn't happen

      if (sols.length > 1) {
        // Pick the rival that isn't our intended path and wall one of its edges.
        var rival = sols[0];
        var same = true;
        for (var q = 0; q < n; q++) if (rival[q] !== path[q]) { same = false; break; }
        if (same) rival = sols[1];

        var options = [];
        for (var e = 0; e + 1 < rival.length; e++) {
          var a = rival[e], b = rival[e + 1];
          if (!used.has(edgeKey(a, b))) options.push(a < b ? [a, b] : [b, a]);
        }
        if (walls.length < cfg.wallBudget && options.length) {
          walls.push(options[(rng() * options.length) | 0]);
          walls.sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; });
          continue;
        }
        if (addWaypoint()) continue;
        return null;                                  // out of levers
      }

      var stats = eng.analyze(path);
      if (stats.guesses > cfg.maxGuesses) {
        // More numbers is the only thing that reliably makes a puzzle easier.
        if (addWaypoint()) continue;
        return null;
      }
      if (stats.guesses < cfg.minGuesses) return null; // this path is too tame
      puzzle.stats = stats;
      puzzle.stats.waypointCount = wpIdx.length;
      puzzle.stats.wallCount = walls.length;
      puzzle.stats.refineSteps = step;
      return puzzle;
    }
    return null;
  }

  function generate(opts) {
    var o = opts || {};
    var rows = o.rows || 6, cols = o.cols || 6;
    var rng = o.rng || mulberry32((Math.random() * 4294967296) >>> 0);
    var cfg = {
      waypoints: o.waypoints || 4,
      maxWaypoints: o.maxWaypoints || 10,
      wallBudget: o.wallBudget == null ? 8 : o.wallBudget,
      minGuesses: o.minGuesses == null ? 0 : o.minGuesses,
      maxGuesses: o.maxGuesses == null ? Infinity : o.maxGuesses,
      minGap: o.minGap || 2,
      seedWalls: o.seedWalls == null ? Math.round((o.wallBudget == null ? 8 : o.wallBudget) * 0.6) : o.seedWalls,
      maxRefineSteps: o.maxRefineSteps || 40
    };
    var maxAttempts = o.maxAttempts || 300;
    for (var attempt = 0; attempt < maxAttempts; attempt++) {
      var path = backbite(rows, cols, rng, o.mixIterations);
      var puzzle = refine(path, rows, cols, rng, cfg);
      if (puzzle) {
        puzzle.stats.attempts = attempt + 1;
        return puzzle;
      }
    }
    return null;
  }

  // ----------------------------------------------------------------- tiers

  // Bands are calibrated in test/calibrate.js against measured guess counts.
  var DIFFICULTIES = {
    easy: {
      label: 'Easy', rows: 5, cols: 5, wallBudget: 4,
      waypoints: 4, maxWaypoints: 10, minGuesses: 0, maxGuesses: 2
    },
    medium: {
      label: 'Medium', rows: 6, cols: 6, wallBudget: 6,
      waypoints: 4, maxWaypoints: 9, minGuesses: 3, maxGuesses: 6
    },
    hard: {
      label: 'Hard', rows: 7, cols: 7, wallBudget: 10,
      waypoints: 4, maxWaypoints: 8, minGuesses: 7, maxGuesses: 11
    },
    expert: {
      label: 'Expert', rows: 8, cols: 8, wallBudget: 18,
      waypoints: 4, maxWaypoints: 9, minGuesses: 12, maxGuesses: Infinity
    }
  };
  var DIFFICULTY_ORDER = ['easy', 'medium', 'hard', 'expert'];

  function generateDifficulty(name, seed) {
    var preset = DIFFICULTIES[name] || DIFFICULTIES.medium;
    var opts = {};
    for (var key in preset) opts[key] = preset[key];
    opts.rng = mulberry32(seed == null ? (Math.random() * 4294967296) >>> 0 : seed);
    var puzzle = generate(opts);
    if (puzzle) puzzle.difficulty = name;
    return puzzle;
  }

  return {
    mulberry32: mulberry32,
    gridNeighbors: gridNeighbors,
    buildAdjacency: buildAdjacency,
    backbite: backbite,
    pickWalls: pickWalls,
    pickWaypointIndices: pickWaypointIndices,
    makeEngine: makeEngine,
    refine: refine,
    generate: generate,
    generateDifficulty: generateDifficulty,
    DIFFICULTIES: DIFFICULTIES,
    DIFFICULTY_ORDER: DIFFICULTY_ORDER
  };
});

</script>
<!-- ===== game: rendering, input, timing ===== -->
<script>
(function () {
  'use strict';

  var U = 100;                       // viewBox units per cell
  var PAD = 6;                       // viewBox inset, so strokes are not clipped
  var el = function (id) { return document.getElementById(id); };
  var SVG = 'http://www.w3.org/2000/svg';

  var state = {
    difficulty: localStorage.getItem('zip.difficulty') || 'medium',
    theme: localStorage.getItem('zip.theme') || 'system',
    autoNext: localStorage.getItem('zip.autoNext') !== 'off',
    puzzle: null, engine: null, path: [], inPath: null, nodes: [],
    startedAt: 0, elapsed: 0, running: false, timerStarted: false,
    solved: false, revealed: false,
    prefetched: null, prefetchFor: null, advanceTimer: 0,
    session: { solved: 0, total: 0, streak: 0, bestStreak: 0 },
    pops: [], sweep: null, confetti: null, hint: null, hintsUsed: 0,
    interacted: false
  };

  /*
   * A little audio, built from oscillators so the page stays a single file with
   * no assets. Steps click at a pitch that rises as the board fills, so a run
   * has a shape you can hear; numbers ring brighter; a solve resolves. Kept
   * quiet and short -- this plays hundreds of times a session.
   */
  var SOUND_MODES = ['all', 'sparse', 'off'];
  var storedSound = localStorage.getItem('zip.sound');
  // Silent until asked for. The click is nice for some and grating for others,
  // and a puzzle you drill in public should not make noise by surprise.
  if (storedSound === null) storedSound = 'off';
  if (storedSound === 'on') storedSound = 'all';          // pre-3-state value
  var audio = { ctx: null, mode: SOUND_MODES.indexOf(storedSound) >= 0 ? storedSound : 'all' };

  function audible() { return audio.mode !== 'off'; }

  function ensureAudio() {
    if (audio.ctx || !audible()) return;
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    try { audio.ctx = new AC(); } catch (e) { audio.ctx = null; }
  }
  function tone(freq, delay, dur, level, shape) {
    if (!audio.ctx) return;
    var t = audio.ctx.currentTime + delay;
    var osc = audio.ctx.createOscillator(), gain = audio.ctx.createGain();
    osc.type = shape || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(level, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audio.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function buzz(pattern) {
    // Browsers reject (and log) haptics before the user has actually touched
    // the page, so don't ask until they have.
    if (!audible() || !state.interacted) return;
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
      try { navigator.vibrate(pattern); } catch (e) { /* not supported */ }
    }
  }
  function soundStep(progress) {
    if (audio.mode !== 'all') return;      // 'sparse' keeps only numbers and wins
    ensureAudio();
    tone(280 * Math.pow(2, progress * 1.2), 0, 0.05, 0.028, 'sine');
  }
  function soundNumber(index) {
    if (!audible()) return;
    ensureAudio();
    var base = 523.25 * Math.pow(2, Math.min(index, 12) / 12);
    tone(base, 0, 0.11, 0.045, 'triangle');
    tone(base * 1.5, 0.045, 0.13, 0.022, 'sine');
    buzz(8);
  }
  function soundWin(isBest) {
    if (!audible()) return;
    ensureAudio();
    var chord = isBest ? [0, 4, 7, 12, 16] : [0, 4, 7, 12];
    for (var i = 0; i < chord.length; i++) {
      tone(523.25 * Math.pow(2, chord[i] / 12), i * 0.07, 0.34, 0.045, 'triangle');
    }
    buzz([14, 46, 22]);
  }

  // Live drag state: where the pointer is on the board, how far the line has
  // reached past the last committed cell, and the tail used to ease it home on
  // release. rectCache exists because reading the board rect on every
  // pointermove forces a layout, which is its own source of stutter.
  var drag = { active: false, at: null, tip: null, settle: null };
  var rectCache = null;

  // ------------------------------------------------------------- rendering

  function node(name, attrs) {
    var e = document.createElementNS(SVG, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function cx(cell) { return ((cell % state.puzzle.cols) + 0.5) * U; }
  function cy(cell) { return (((cell / state.puzzle.cols) | 0) + 0.5) * U; }

  function drawStatic() {
    var p = state.puzzle, svg = el('board'), i;
    svg.setAttribute('viewBox',
      -PAD + ' ' + -PAD + ' ' + (p.cols * U + 2 * PAD) + ' ' + (p.rows * U + 2 * PAD));
    svg.style.aspectRatio = (p.cols * U + 2 * PAD) + ' / ' + (p.rows * U + 2 * PAD);
    svg.innerHTML = '';

    // One board surface with interior rules, rather than a tray of loose tiles.
    svg.appendChild(node('rect', {
      x: 0, y: 0, width: p.cols * U, height: p.rows * U, rx: 14,
      fill: 'var(--board)', stroke: 'var(--line)', 'stroke-width': 2
    }));
    var rules = node('g', { stroke: 'var(--line)', 'stroke-width': 1.5 });
    for (i = 1; i < p.cols; i++) rules.appendChild(node('line', { x1: i * U, y1: 7, x2: i * U, y2: p.rows * U - 7 }));
    for (i = 1; i < p.rows; i++) rules.appendChild(node('line', { x1: 7, y1: i * U, x2: p.cols * U - 7, y2: i * U }));
    svg.appendChild(rules);

    svg.appendChild(node('polyline', {
      id: 'trail', fill: 'none', stroke: 'var(--path)', 'stroke-width': 26,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', points: ''
    }));
    svg.appendChild(node('circle', { id: 'head', r: 0, fill: 'var(--board)' }));

    // Numbers keep their nodes: as the path reaches them they recolour to match
    // it, so the line reads as passing through instead of disappearing behind.
    state.nodes = [];
    var nums = node('g', {});
    p.waypoints.forEach(function (cell, idx) {
      var ring = node('circle', {
        cx: cx(cell), cy: cy(cell), r: 40, fill: 'none',
        stroke: 'var(--ink)', 'stroke-width': 2.5, opacity: 0
      });
      var disc = node('circle', { cx: cx(cell), cy: cy(cell), r: 30, fill: 'var(--accent)' });
      var text = node('text', {
        x: cx(cell), y: cy(cell), 'text-anchor': 'middle', 'dominant-baseline': 'central',
        fill: 'var(--accent-ink)', 'font-size': 38, 'font-weight': 700,
        'font-family': 'ui-sans-serif, system-ui, sans-serif'
      });
      text.textContent = String(idx + 1);
      nums.appendChild(ring); nums.appendChild(disc); nums.appendChild(text);
      state.nodes.push({ ring: ring, disc: disc, text: text, cell: cell });
    });
    svg.appendChild(nums);

    // Walls span the whole shared edge, so which two cells they separate is
    // never in doubt -- short marks floating in a gutter read as decoration.
    var walls = node('g', { stroke: 'var(--wall)', 'stroke-width': 9, 'stroke-linecap': 'round' });
    p.walls.forEach(function (w) {
      var a = w[0], b = w[1];
      if (b - a === 1) {
        var vx = (b % p.cols) * U, vy = ((a / p.cols) | 0) * U;
        walls.appendChild(node('line', { x1: vx, y1: vy + 6, x2: vx, y2: vy + U - 6 }));
      } else {
        var hy = ((b / p.cols) | 0) * U, hx = (a % p.cols) * U;
        walls.appendChild(node('line', { x1: hx + 6, y1: hy, x2: hx + U - 6, y2: hy }));
      }
    });
    svg.appendChild(walls);
  }

  function numbersTaken() {
    var count = 0;
    for (var i = 0; i < state.path.length; i++) {
      if (state.engine.numAt[state.path[i]] !== 0) count++;
    }
    return count;
  }

  // Respect a reduced-motion preference for the purely decorative flourishes.
  function reducedMotion() {
    return typeof matchMedia === 'function' &&
           matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function lineColour() {
    return state.solved ? 'var(--good)' : state.revealed ? 'var(--dim)' : 'var(--path)';
  }

  /*
   * The line is the committed cells plus a live tip that follows the pointer
   * inside the current cell. Without the tip the line can only advance a whole
   * cell at a time, which is what made dragging feel like stamping segments
   * instead of drawing one. The tip reaches at most half a cell, which is
   * exactly where the next cell commits, so the handover is seamless going
   * forwards and backwards.
   */
  function renderTrail() {
    var p = state.puzzle, board = el('board');
    var trail = board.querySelector('#trail'), head = board.querySelector('#head');
    if (!trail || !p) return;
    var tip = drag.tip || drag.settle;
    var path = state.path, upto = path.length;
    // While retracting, drop the head vertex: otherwise the stroke doubles back
    // over itself and the line never looks like it is shortening.
    if (tip && tip.retract && upto > 1) upto--;

    var pts = [], i;
    for (i = 0; i < upto; i++) pts.push(cx(path[i]) + ',' + cy(path[i]));
    var tx, ty;
    if (tip && path.length) {
      var h = path[path.length - 1];
      tx = cx(h) + tip.ux * tip.amount;
      ty = cy(h) + tip.uy * tip.amount;
      pts.push(tx + ',' + ty);
    }
    trail.setAttribute('points', pts.join(' '));
    trail.setAttribute('stroke', lineColour());

    if (path.length) {
      var last = path[path.length - 1];
      head.setAttribute('cx', tx == null ? cx(last) : tx);
      head.setAttribute('cy', ty == null ? cy(last) : ty);
      head.setAttribute('r', 8);       // a dot inside the stroke marks where you are
      head.setAttribute('fill', 'var(--board)');
    } else {
      head.setAttribute('r', 0);
    }

    el('filled').textContent = path.length;
    var bar = el('progressFill');
    bar.style.width = (path.length / (p.rows * p.cols) * 100) + '%';
    bar.classList.toggle('done', state.solved);
  }

  function renderNumbers() {
    var taken = numbersTaken(), colour = lineColour();
    for (var i = 0; i < state.nodes.length; i++) {
      var nd = state.nodes[i], visited = state.inPath[nd.cell];
      nd.disc.setAttribute('fill', visited ? colour : 'var(--accent)');
      nd.text.setAttribute('fill', visited ? 'var(--path-ink)' : 'var(--accent-ink)');
      // Ring the number you are heading for next -- one less thing to scan for.
      nd.ring.setAttribute('opacity', (i === taken && !state.solved && !state.revealed) ? 0.45 : 0);
    }
  }

  function render() { renderTrail(); renderNumbers(); }

  // --------------------------------------------------------------- moves

  function push(cell) {
    state.path.push(cell);
    state.inPath[cell] = 1;
    startClock();
    clearHint();
    var number = state.engine.numAt[cell];
    if (number) {
      soundNumber(number - 1);
      popNumber(number - 1);
    } else {
      soundStep(state.path.length / state.engine.n);
    }
    render();
    checkWin();
  }

  // A reached number swells briefly -- the one bit of motion that confirms a
  // milestone without asking you to look away from the line.
  function popNumber(index) {
    var nd = state.nodes[index];
    if (nd) state.pops.push({ node: nd, start: performance.now() });
  }

  /*
   * On a solve, a bright dash runs the length of the finished route once. It is
   * a decorative overlay on top of the real line, so it cannot affect state --
   * if the frames never run, nothing is lost.
   */
  function startSweep() {
    if (reducedMotion()) return;
    var board = el('board'), trail = board.querySelector('#trail');
    if (!trail) return;
    var span = (state.path.length - 1) * U + 160;
    var shine = node('polyline', {
      id: 'shine', fill: 'none', stroke: 'var(--path-ink)', 'stroke-width': 22,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.8,
      points: trail.getAttribute('points'),
      'stroke-dasharray': '80 ' + span, 'stroke-dashoffset': span
    });
    board.appendChild(shine);
    state.sweep = { node: shine, start: performance.now(), span: span };
  }

  function pop() {
    if (state.path.length <= 1) return;
    state.inPath[state.path.pop()] = 0;
    state.solved = false;
    clearHint();
    setBanner(null);
    render();
  }

  function step(cell) {
    if (state.solved || state.revealed) return;
    if (!state.path.length) {
      if (state.engine.canStep(state.path, state.inPath, cell)) push(cell);
      return;
    }
    var head = state.path[state.path.length - 1];
    if (cell === head) return;
    if (state.path.length > 1 && cell === state.path[state.path.length - 2]) { pop(); return; }
    // Anything else already on the line is ignored. Jumping the head back to an
    // arbitrary drawn cell used to erase everything after it, which a stray
    // mouse movement could trigger by accident. The only way back is to retrace
    // the line one square at a time (or Undo).
    if (state.inPath[cell]) return;
    if (state.engine.canStep(state.path, state.inPath, cell)) push(cell);
  }

  function checkWin() {
    if (state.path.length !== state.engine.n) return;
    if (state.engine.validate(state.path)) {           // checked against the rules, not the stored path
      state.solved = true;
      stopClock();
      render();
      recordBest();
    } else {
      setBanner('Every cell filled, but the path must end on the last number.', 'bad');
    }
  }

  /*
   * Celebration. Fired on every solve, and roughly twice the size when a
   * personal best falls. Particles live in a fixed full-viewport layer so the
   * burst is not boxed inside the board, and the whole group is torn down when
   * it finishes. Waves are scheduled inside the animation loop rather than on
   * timers, so nothing can fire after the layer is gone.
   */
  var CONFETTI_COLOURS = [
    'var(--accent)', 'var(--path)', 'var(--good)', '#ff5f9e', '#8b5cf6', '#ffffff'
  ];

  function spawnBurst(store, x, y, count, power) {
    for (var i = 0; i < count; i++) {
      var angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.5;
      var speed = (260 + Math.random() * 620) * power;
      var size = 5 + Math.random() * 8;
      var round = Math.random() < 0.35;
      var bit = round
        ? node('circle', { r: size / 2, fill: CONFETTI_COLOURS[(Math.random() * CONFETTI_COLOURS.length) | 0] })
        : node('rect', {
            x: -size / 2, y: -size / 2, width: size, height: size, rx: 1.5,
            fill: CONFETTI_COLOURS[(Math.random() * CONFETTI_COLOURS.length) | 0]
          });
      store.layer.appendChild(bit);
      store.parts.push({
        node: bit, x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        rot: Math.random() * 360, spin: (Math.random() - 0.5) * 900,
        round: round
      });
    }
  }

  function celebrate(isBest) {
    if (reducedMotion()) return;
    var layer = el('fx');
    if (!layer) return;
    layer.innerHTML = '';
    invalidateRect();                        // the page may have scrolled since the drag
    var r = boardRect();
    if (!r || !r.width) return;
    var head = state.path[state.path.length - 1];
    var p = state.puzzle;
    var scale = r.width / (p.cols * U + 2 * PAD);
    var hx = r.left + (cx(head) + PAD) * scale;
    var hy = r.top + (cy(head) + PAD) * scale;

    // A burst where the line finished, then two more from the lower corners of
    // the board a beat later, so it reads as a cascade rather than one puff.
    var big = isBest ? 2 : 1;
    var waves = [
      { at: 0.00, x: hx, y: hy, n: 46 * big, power: 1 },
      { at: 0.16, x: r.left + r.width * 0.12, y: r.top + r.height * 0.95, n: 26 * big, power: 1.25 },
      { at: 0.30, x: r.left + r.width * 0.88, y: r.top + r.height * 0.95, n: 26 * big, power: 1.25 }
    ];
    if (isBest) waves.push({ at: 0.48, x: r.left + r.width / 2, y: r.top + r.height * 0.6, n: 60, power: 1.5 });

    var now = performance.now();
    state.confetti = { layer: layer, parts: [], waves: waves, start: now, last: now };

    var board = el('board');
    board.classList.remove('won');
    void board.getBoundingClientRect();      // restart the animation if it is mid-flight
    board.classList.add('won');
  }

  // --------------------------------------------------------------- clock  // --------------------------------------------------------------- clock

  function fmt(ms) {
    var s = Math.max(0, ms) / 1000;
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + Math.floor((s * 10) % 10);
  }
  function startClock() {
    if (state.running || state.solved) return;
    state.running = true;
    state.timerStarted = true;
    state.startedAt = performance.now() - state.elapsed;
  }
  function stopClock() { state.running = false; }
  function tick() {
    if (state.running) state.elapsed = performance.now() - state.startedAt;
    el('clock').textContent = fmt(state.elapsed);
    el('clock').classList.toggle('done', state.solved);
    if (drag.settle) {                     // ease the tip back rather than snap
      drag.settle.amount *= 0.6;
      if (drag.settle.amount < 0.8) drag.settle = null;
      renderTrail();
    }
    if (state.pops.length) {
      var now = performance.now(), alive = [];
      for (var i = 0; i < state.pops.length; i++) {
        var pop = state.pops[i], k = (now - pop.start) / 240;
        if (k >= 1) { pop.node.disc.setAttribute('r', 30); continue; }
        pop.node.disc.setAttribute('r', 30 + 9 * Math.sin(Math.PI * k));
        alive.push(pop);
      }
      state.pops = alive;
    }
    if (state.confetti) {
      var cf = state.confetti, at = performance.now();
      var dt = Math.min(0.05, (at - cf.last) / 1000);
      cf.last = at;
      var life = (at - cf.start) / 1000;
      while (cf.waves.length && life >= cf.waves[0].at) {
        var w = cf.waves.shift();
        spawnBurst(cf, w.x, w.y, w.n, w.power);
      }
      if (life > 2.1) {
        cf.layer.innerHTML = '';
        state.confetti = null;
      } else {
        for (var c = 0; c < cf.parts.length; c++) {
          var bit = cf.parts[c];
          bit.vy += 1500 * dt;
          bit.vx *= 0.995;
          bit.x += bit.vx * dt;
          bit.y += bit.vy * dt;
          bit.rot += bit.spin * dt;
          bit.node.setAttribute('transform', bit.round
            ? 'translate(' + bit.x + ',' + bit.y + ')'
            : 'translate(' + bit.x + ',' + bit.y + ') rotate(' + bit.rot + ')');
          bit.node.setAttribute('opacity', Math.max(0, 1 - Math.max(0, life - 0.9) / 1.2));
        }
      }
    }
    if (state.sweep) {
      var done = (performance.now() - state.sweep.start) / 800;
      if (done >= 1) {
        if (state.sweep.node.parentNode) state.sweep.node.parentNode.removeChild(state.sweep.node);
        state.sweep = null;
      } else {
        state.sweep.node.setAttribute('stroke-dashoffset', state.sweep.span * (1 - done));
        state.sweep.node.setAttribute('opacity', 0.8 * (1 - done * done));
      }
    }
    requestAnimationFrame(tick);
  }

  function bestKey() { return 'zip.best.' + state.difficulty; }
  function showBest() {
    var v = localStorage.getItem(bestKey());
    el('best').textContent = v ? fmt(Number(v)) : '—';
  }
  function showSession() {
    var s = state.session;
    if (!s.solved) { el('session').textContent = 'no solves yet'; return; }
    el('session').textContent = s.solved + ' solved · avg ' + fmt(s.total / s.solved) +
      (s.streak >= 2 ? ' · streak ' + s.streak : '');
  }

  function recordBest() {
    if (state.revealed) return;
    var prev = Number(localStorage.getItem(bestKey()) || Infinity);
    // A hinted solve counts for the session but never sets a record -- a best
    // time you were walked through is not a time.
    var isBest = state.elapsed < prev && state.hintsUsed === 0;
    if (isBest) localStorage.setItem(bestKey(), String(Math.round(state.elapsed)));
    showBest();
    state.session.solved++;
    state.session.total += state.elapsed;
    state.session.streak++;
    if (state.session.streak > state.session.bestStreak) state.session.bestStreak = state.session.streak;
    showSession();
    soundWin(isBest);
    startSweep();
    var sub = null;
    if (state.hintsUsed) {
      sub = state.hintsUsed + (state.hintsUsed === 1 ? ' hint' : ' hints') + ' — not a record';
    } else if (isFinite(prev)) {
      sub = isBest ? 'beat ' + fmt(prev) : fmt(state.elapsed - prev) + ' off your best';
    }
    setBanner((isBest ? 'New best · ' : cheer() + ' · ') + fmt(state.elapsed), 'good', sub);
    celebrate(isBest);
    if (state.autoNext) state.advanceTimer = setTimeout(newPuzzle, 1800);
  }

  // A little variety on the win line. Never the same one twice running, so it
  // reads as acknowledgement rather than a stuck string.
  var CHEERS = ['Nice.', 'Clean run.', 'Smooth.', 'Tidy.', 'Got it.', 'Locked in.'];
  var lastCheer = -1;
  function cheer() {
    var pick = lastCheer;
    while (pick === lastCheer && CHEERS.length > 1) pick = (Math.random() * CHEERS.length) | 0;
    lastCheer = pick;
    return CHEERS[pick];
  }

  function setBanner(text, kind, sub) {
    var b = el('banner');
    if (!text) { b.classList.remove('show'); return; }
    el('bannerText').innerHTML = text + (sub ? '<small>' + sub + '</small>' : '');
    el('bannerText').style.color =
      kind === 'bad' ? 'var(--bad)' : kind === 'wait' ? 'var(--dim)' : 'var(--good)';
    b.classList.add('show');
  }

  /*
   * Hints. Because the puzzle has exactly one solution, any path that can still
   * be finished must be a prefix of it -- so checking the drawn path against
   * the solution is both the "what next" test and the "are you already lost"
   * test. If you are lost, the board resets and the hint points out the very
   * first move instead.
   */
  function pathIsSalvageable() {
    var sol = state.puzzle.solution;
    if (state.path.length > sol.length) return false;
    for (var i = 0; i < state.path.length; i++) {
      if (state.path[i] !== sol[i]) return false;
    }
    return true;
  }

  function hint() {
    if (!state.puzzle || state.solved || state.revealed) return;
    clearTimeout(state.advanceTimer);
    var sol = state.puzzle.solution;
    var lost = !pathIsSalvageable();
    if (lost) {
      restart();
      setBanner('Off track — back to the start', 'bad');
      setTimeout(function () { setBanner(null); }, 1500);
    }
    // After a reset the path is empty, so the hint is the opening move.
    var from = state.path.length ? state.path[state.path.length - 1] : sol[0];
    var to = state.path.length ? sol[state.path.length] : sol[1];
    if (to == null) return;
    state.hintsUsed++;
    showHint(from, to);
    if (audible()) { ensureAudio(); tone(880, 0, 0.07, 0.03, 'sine'); }
  }

  function clearHint() {
    if (!state.hint) return;
    if (state.hint.group.parentNode) state.hint.group.parentNode.removeChild(state.hint.group);
    clearTimeout(state.hint.timer);
    state.hint = null;
  }

  function showHint(from, to) {
    clearHint();
    var board = el('board'), p = state.puzzle;
    var group = node('g', { id: 'hint' });
    // The square to go to, and an arrow at the edge between the two pointing
    // into it -- direction is the thing you actually need, not just a target.
    group.appendChild(node('rect', {
      x: (to % p.cols) * U + 6, y: ((to / p.cols) | 0) * U + 6,
      width: U - 12, height: U - 12, rx: 12,
      fill: 'var(--accent)', opacity: 0.22
    }));
    var dx = (to % p.cols) - (from % p.cols);
    var dy = ((to / p.cols) | 0) - ((from / p.cols) | 0);
    var mx = (cx(from) + cx(to)) / 2, my = (cy(from) + cy(to)) / 2;
    var arrow = node('path', {
      d: 'M -13 -15 L 8 0 L -13 15', fill: 'none', stroke: 'var(--accent)',
      'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      transform: 'translate(' + mx + ',' + my + ') rotate(' +
        (dx === 1 ? 0 : dx === -1 ? 180 : dy === 1 ? 90 : 270) + ')'
    });
    group.appendChild(arrow);
    board.appendChild(group);
    state.hint = {
      group: group,
      timer: setTimeout(function () { clearHint(); }, 2600)
    };
  }

  // ------------------------------------------------------------- puzzles

  function prefetch() {
    var want = state.difficulty;
    setTimeout(function () {
      if (state.prefetchFor === want && state.prefetched) return;
      var p = Zip.generateDifficulty(want);
      if (p) { state.prefetched = p; state.prefetchFor = want; }
    }, 250);
  }

  function load(puzzle) {
    state.puzzle = puzzle;
    state.engine = Zip.makeEngine(puzzle);
    state.path = [];
    state.inPath = new Uint8Array(puzzle.rows * puzzle.cols);
    state.elapsed = 0; state.running = false; state.timerStarted = false;
    state.solved = false; state.revealed = false;
    drag.active = false; drag.tip = null; drag.settle = null; drag.at = null;
    clearHint();
    state.hintsUsed = 0;
    state.confetti = null;
    if (el('fx')) el('fx').innerHTML = '';
    el('board').classList.remove('won');
    invalidateRect();
    setBanner(null);
    drawStatic();
    render();
    el('total').textContent = puzzle.rows * puzzle.cols;
    el('tierStats').textContent =
      Zip.DIFFICULTIES[puzzle.difficulty || state.difficulty].label + ' · ' + puzzle.rows + '×' + puzzle.cols;
    showBest();
    showSession();
  }

  function newPuzzle() {
    clearTimeout(state.advanceTimer);
    var board = el('board');
    var ready = (state.prefetchFor === state.difficulty) ? state.prefetched : null;
    state.prefetched = null; state.prefetchFor = null;
    if (ready) { load(ready); prefetch(); return; }
    board.classList.add('busy');
    setBanner('Generating…', 'wait');
    setTimeout(function () {                     // let the frame paint before we block
      var p = Zip.generateDifficulty(state.difficulty);
      board.classList.remove('busy');
      setBanner(null);
      if (p) load(p);
      prefetch();
    }, 16);
  }

  function restart() {
    clearTimeout(state.advanceTimer);
    state.path = [];
    state.inPath.fill(0);
    state.solved = false; state.revealed = false;
    /*
     * The clock belongs to the puzzle, not to the attempt. Clearing the board
     * never clears the time -- otherwise a bad run could be wiped to protect a
     * best -- and it resumes straight away rather than waiting for the first
     * move, so hesitating after a restart costs what it should. Only a new
     * puzzle starts a new clock.
     */
    if (state.timerStarted) {
      state.running = true;
      state.startedAt = performance.now() - state.elapsed;
    }
    drag.tip = null; drag.settle = null;
    clearHint();
    state.confetti = null;
    if (el('fx')) el('fx').innerHTML = '';
    el('board').classList.remove('won');
    setBanner(null);
    render();
  }

  // ---------------------------------------------------------------- input

  // The viewBox is inset by PAD on every side, so board pixels are not a plain
  // division of the rect. One scale taken from the width serves both axes --
  // the viewBox aspect matches the element's, so this stays exact.
  function boardRect() {
    if (!rectCache) rectCache = el('board').getBoundingClientRect();
    return rectCache;
  }
  function invalidateRect() { rectCache = null; }

  function toBoard(clientX, clientY) {
    var p = state.puzzle, r = boardRect();
    if (!p || !r || !r.width) return null;
    var scale = r.width / (p.cols * U + 2 * PAD);            // px per viewBox unit
    return { x: (clientX - r.left) / scale - PAD, y: (clientY - r.top) / scale - PAD };
  }

  function cellAtBoard(v) {
    var p = state.puzzle;
    var col = Math.floor(v.x / U), row = Math.floor(v.y / U);
    if (col < 0 || row < 0 || col >= p.cols || row >= p.rows) return -1;
    return row * p.cols + col;
  }

  function cellAt(clientX, clientY) {
    var v = toBoard(clientX, clientY);
    return v ? cellAtBoard(v) : -1;
  }

  // How far the line should reach past the last committed cell, given where the
  // pointer is. Half a cell is the ceiling: at exactly half, the pointer has
  // crossed into the next cell and that step commits.
  function computeTip(v) {
    if (!state.path.length || state.solved || state.revealed) return null;
    var p = state.puzzle, head = state.path[state.path.length - 1];
    var dx = v.x - cx(head), dy = v.y - cy(head);
    var ux = 0, uy = 0, reach;
    if (Math.abs(dx) >= Math.abs(dy)) { ux = dx < 0 ? -1 : 1; reach = Math.abs(dx); }
    else { uy = dy < 0 ? -1 : 1; reach = Math.abs(dy); }
    if (reach < 1) return null;
    var col = (head % p.cols) + ux, row = ((head / p.cols) | 0) + uy;
    if (col < 0 || row < 0 || col >= p.cols || row >= p.rows) return null;
    var neighbour = row * p.cols + col;
    var retract = state.path.length > 1 && neighbour === state.path[state.path.length - 2];
    // A blocked direction still gives a little, so pushing at a wall feels like
    // resistance rather than a dead control.
    var limit = (retract || state.engine.canStep(state.path, state.inPath, neighbour))
      ? U / 2 : U * 0.13;
    return { ux: ux, uy: uy, amount: Math.min(reach, limit), retract: retract };
  }

  var board = el('board');
  board.addEventListener('pointerdown', function (e) {
    state.interacted = true;
    invalidateRect();
    var v = toBoard(e.clientX, e.clientY);
    if (!v) return;
    var c = cellAtBoard(v);
    if (c < 0) return;
    drag.active = true; drag.at = v; drag.settle = null;
    board.setPointerCapture(e.pointerId);
    step(c);
    drag.tip = computeTip(v);
    renderTrail();
    e.preventDefault();
  });

  board.addEventListener('pointermove', function (e) {
    if (!drag.active) return;
    var v = toBoard(e.clientX, e.clientY);
    if (!v) return;
    // Walk the segment travelled since the last event rather than sampling only
    // its endpoint, so a fast drag cannot jump a cell and stall the line.
    var from = drag.at || v;
    var span = Math.hypot(v.x - from.x, v.y - from.y);
    var samples = Math.min(32, Math.max(1, Math.ceil(span / (U * 0.34))));
    for (var i = 1; i <= samples; i++) {
      var c = cellAtBoard({
        x: from.x + (v.x - from.x) * i / samples,
        y: from.y + (v.y - from.y) * i / samples
      });
      if (c >= 0) step(c);
    }
    drag.at = v;
    drag.tip = computeTip(v);
    renderTrail();
  });

  function endDrag(e) {
    if (!drag.active) return;
    drag.active = false;
    drag.settle = drag.tip;              // let the tip ease home instead of snapping
    drag.tip = null;
    drag.at = null;
    if (board.hasPointerCapture && e && e.pointerId != null && board.hasPointerCapture(e.pointerId)) {
      board.releasePointerCapture(e.pointerId);
    }
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', invalidateRect);
    window.addEventListener('scroll', invalidateRect, true);
  }

  var ARROWS = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
  document.addEventListener('keydown', function (e) {
    state.interacted = true;
    if (ARROWS[e.key]) {
      e.preventDefault();
      if (!state.path.length) { step(state.puzzle.waypoints[0]); return; }
      var head = state.path[state.path.length - 1], p = state.puzzle;
      var row = (head / p.cols | 0) + ARROWS[e.key][0], col = (head % p.cols) + ARROWS[e.key][1];
      if (row < 0 || col < 0 || row >= p.rows || col >= p.cols) return;
      step(row * p.cols + col);
      return;
    }
    var k = e.key.toLowerCase();
    if (k === 'u' || e.key === 'Backspace') { e.preventDefault(); pop(); }
    else if (k === 'h') hint();
    else if (k === 'r') restart();
    else if (k === 'n') newPuzzle();
  });

  el('newBtn').onclick = newPuzzle;
  el('restartBtn').onclick = restart;
  el('undoBtn').onclick = pop;
  el('hintBtn').onclick = hint;
  el('revealBtn').onclick = function () {
    clearTimeout(state.advanceTimer);
    stopClock();
    state.revealed = true; state.solved = false;
    state.session.streak = 0;
    showSession();
    state.path = state.puzzle.solution.slice();
    state.inPath.fill(1);
    render();
    setBanner('Revealed', 'bad');
  };

  // --------------------------------------------------------------- prefs

  function applyTheme() {
    var root = document.documentElement;
    if (state.theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', state.theme);
    el('themeBtn').setAttribute('title', 'Theme: ' + state.theme);
  }
  el('themeBtn').onclick = function () {
    state.theme = state.theme === 'system' ? 'light' : state.theme === 'light' ? 'dark' : 'system';
    localStorage.setItem('zip.theme', state.theme);
    applyTheme();
  };

  var SOUND_LABEL = { all: 'Sound: every step', sparse: 'Sound: numbers and wins', off: 'Sound: off' };
  function applySound() {
    el('soundBtn').setAttribute('aria-pressed', String(audible()));
    el('soundBtn').setAttribute('title', SOUND_LABEL[audio.mode]);
    var near = document.getElementById('soundWave');
    var far = document.getElementById('soundWaveFar');
    var mute = document.getElementById('soundMute');
    if (near) near.style.display = audible() ? '' : 'none';
    if (far) far.style.display = audio.mode === 'all' ? '' : 'none';
    if (mute) mute.style.display = audible() ? 'none' : '';
  }
  el('soundBtn').onclick = function () {
    audio.mode = SOUND_MODES[(SOUND_MODES.indexOf(audio.mode) + 1) % SOUND_MODES.length];
    localStorage.setItem('zip.sound', audio.mode);
    applySound();
    if (audible()) { ensureAudio(); tone(660, 0, 0.09, 0.04, 'triangle'); }
  };

  function applyAuto() {
    el('autoBtn').setAttribute('aria-pressed', String(state.autoNext));
  }
  el('autoBtn').onclick = function () {
    state.autoNext = !state.autoNext;
    localStorage.setItem('zip.autoNext', state.autoNext ? 'on' : 'off');
    if (!state.autoNext) clearTimeout(state.advanceTimer);
    applyAuto();
  };

  // ---------------------------------------------------------------- boot

  Zip.DIFFICULTY_ORDER.forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'tier';
    b.textContent = Zip.DIFFICULTIES[name].label;
    b.setAttribute('aria-pressed', String(name === state.difficulty));
    b.onclick = function () {
      state.difficulty = name;
      localStorage.setItem('zip.difficulty', name);
      Array.prototype.forEach.call(el('tiers').children, function (c) {
        c.setAttribute('aria-pressed', String(c === b));
      });
      newPuzzle();
    };
    el('tiers').appendChild(b);
  });

  applyTheme();
  applySound();
  applyAuto();
  showSession();
  tick();
  newPuzzle();

  // Test hook. Only present when the page is opened with ?test, so the render
  // tests can drive a known puzzle instead of whatever was generated.
  if (location.search.indexOf('test') >= 0) {
    window.__zip = {
      state: state, step: step, load: load, cellAt: cellAt,
      newPuzzle: newPuzzle, restart: restart, hint: hint, U: U, PAD: PAD, audio: audio
    };
  }
})();
</script>
</body>
</html>
